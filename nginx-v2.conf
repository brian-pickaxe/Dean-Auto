# Nginx configuration for V2 site (Adam's Polishes version)
# This can be served on a subdomain or subdirectory

# Option 1: Serve on a subdomain (e.g., adams.deanauto.com)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name adams.deanauto.com;
#
#     root /var/www/deanauto-v2;
#     index index.html;
#
#     location / {
#         try_files $uri $uri/ $uri.html /index.html;
#     }
#
#     location /_next/static {
#         expires 1y;
#         add_header Cache-Control "public, immutable";
#     }
# }

# Option 2: Serve on a subdirectory (e.g., /v2)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Main site
    location / {
        root /var/www/deanauto;
        index index.html;
        try_files $uri $uri/ $uri.html /index.html;
    }

    # V2 site on /v2 path
    location /v2 {
        alias /var/www/deanauto-v2;
        index index.html;
        try_files $uri $uri/ $uri.html /v2/index.html;
    }

    # Handle Next.js static files for both sites
    location /_next/static {
        root /var/www/deanauto;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /v2/_next/static {
        alias /var/www/deanauto-v2/_next/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

