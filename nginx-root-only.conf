# Nginx config: site at root only (V2 moved to root)
# Use this after moving V2 to root. Redirects /v2 to / so old links work.

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name deanauto.net www.deanauto.net;
    return 301 https://$server_name$request_uri;
}

# HTTPS - Site at root
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deanauto.net www.deanauto.net;

    root /var/www/deanauto;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/deanauto.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deanauto.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Redirect old /v2 URLs to root (e.g. /v2/about -> /about)
    location = /v2 {
        return 301 https://$host/;
    }
    location = /v2/ {
        return 301 https://$host/;
    }
    location ~ ^/v2/(.*)$ {
        return 301 https://$host/$1;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_next/static {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
